<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f2f2f2; }
        .container { width: 400px; margin: 50px auto; padding: 20px; background: white;
            border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);}
        input[type="text"], input[type="password"] {
            width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%; background: #007bff; color: white; padding: 10px;
            border: none; border-radius: 5px; cursor: pointer;
        }
        button:hover { background: #0056b3; }
        .error { color: red; }
    </style>
</head>
<body>

<div class="container">
    <h2>Login</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="{% url 'signup' %}">Signup</a></p>
</div>

</body>
</html>
