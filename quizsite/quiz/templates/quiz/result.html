<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f2f2; text-align:center; }
        .box { width: 450px; margin: 60px auto; padding: 25px; background:white; border-radius:10px;
               box-shadow:0 0 10px rgba(0,0,0,0.1); }
        h2 { color:#333; }
        .score { font-size:22px; margin:15px 0; }
        .btn {
            padding:10px 18px; background:#007bff; color:white; border:none; border-radius:4px;
            text-decoration:none; font-size:16px;
        }
        .btn:hover { background:#0056c7; }
    </style>
</head>
<body>

<div class="box">
    <h2>Quiz Result</h2>

    <p class="score"><b>User:</b> {{ username }}</p>
    <p class="score"><b>Score:</b> {{ score }} / {{ total }}</p>
    <p class="score"><b>Percentage:</b> {{ percentage }}%</p>

    <br>
    <a href="{% url 'certificate' %}" class="btn">Download Certificate</a>
</div>

</body>
</html>
